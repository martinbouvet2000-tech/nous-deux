# Awy — livraison 2.3.0 : les dates dans l'emploi du temps
#
# Les 12 fichiers arrivent en UN SEUL commit : livrer fichier par fichier laisse
# des commits intermediaires qui ne compilent pas, et fait rougir CI et
# deploiement jusqu'au dernier fichier.
#
# Ce fichier fait tout tout seul :
#   1. il decode les 12 fichiers (embarques plus bas, en base64) ;
#   2. il verifie l'empreinte SHA-256 de l'archive PUIS de chaque fichier ;
#   3. il repasse toute la CI sur l'arbre assemble AVANT de commiter ;
#   4. si quoi que ce soit echoue, il s'arrete SANS rien commiter ;
#   5. sinon il commit, relance le deploiement, et se supprime lui-meme.
#
# La migration SQL correspondante est DEJA appliquee en production : la colonne
# slot_date est facultative, l'ancienne version du site continue de fonctionner
# sans la voir.
#
# A faire une seule fois : Settings > Actions > General > Workflow permissions
#                          > "Read and write permissions" > Save.

name: Livraison Awy 2.3.0

on:
  push:
    paths:
      - '.github/workflows/livraison-awy-2-3-0.yml'
      - '.github/workflows/livraison-awy-2-3-0_2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: livraison-awy
  cancel-in-progress: false

jobs:
  livrer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

