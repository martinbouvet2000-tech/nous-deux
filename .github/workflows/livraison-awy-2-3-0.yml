      - name: Verifier l'empreinte de l'archive
        run: |
          attendu="e509f65260266cfca5a15c5a0f87f60e96f6e120d3d30120544631af33dcb38b"
          obtenu="$(sha256sum /tmp/awy/awy.tar.gz | cut -d' ' -f1)"
          echo "attendu : $attendu"
          echo "obtenu  : $obtenu"
          if [ "$attendu" != "$obtenu" ]; then
            echo "::error::Archive abimee pendant le transfert. Rien n'a ete modifie."
            exit 1
          fi

      - name: Extraire les 12 fichiers
        run: |
          tar -xzf /tmp/awy/awy.tar.gz -C .
          git status --porcelain

      - name: Verifier chaque fichier un par un
        run: |
          cat > /tmp/awy/manifest.sha256 <<'FIN_DU_MANIFESTE'
          404e7cf0bfb77e122835faa09a429065c5869b83281204a6807dddbab093cdb7  CHANGELOG.md
          8fdd735e281f192f0fcbd734280b59c59204c26f6138667e253bfef3467d1ebe  README.md
          fed7f92c421e41d97fc14ae5761d52fd846a299d1312ea2ba0223d936632eb29  package.json
          a2f59946ca578e6bd6bffc7c045b40e8463cd9ab4a127afd8e9a13ceb9c0c5a1  src/components/__tests__/ScheduleView.test.tsx
          c9555b9ddcf98ff9a6826f2233d865c29182c24fabeb2024778d886de07f8fd4  src/components/schedule/ScheduleImport.tsx
          cd76a6d7939a7e3007a7cfcfdaf82816a7aaeb95d829ac6403c6ccd2a743b0b3  src/components/schedule/ScheduleView.tsx
          7591c18fc16d9258ae6140531459205bf179832b018be286931529ac1aebdca8  src/lib/__tests__/schedule.test.ts
          52039a4ef62a70d77d9ebb1c7184ccfaadc84f6a5958b87e2241d03de1e19cf1  src/lib/__tests__/scheduleImportParse.test.ts
          f22f455f0c84959d582ed1db9a09548562ac62a878c0e65f81a87ba5a6a1109e  src/lib/schedule.ts
          64694fac4f82ce176d7cf512b2543d3906c6ee5a02eedf09a487c6cde28fd1c5  src/lib/scheduleImport/parse.ts
          58efd20c06192424ba37d370fdbffd9c2116ea91a5b06f34c48844e7b9aabbfd  src/types/database.ts
          019181c3d7c32f9c74c93ecf7481f7b8b6bad3f1e986711a268c40a8f0b1a89b  supabase/migrations/20260831120000_creneaux_dates.sql
          FIN_DU_MANIFESTE
          if ! sha256sum -c /tmp/awy/manifest.sha256; then
            echo "::error::Au moins un fichier ne correspond pas. Rien n'est commite."
            exit 1
          fi
          echo "12/12 fichiers conformes."

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Repasser la CI ici avant de commiter
        run: |
          npm ci
          npm run type-check
          npx eslint . --max-warnings 10
          npx vitest run
          npm run build:pages
          echo "CI verte sur l'arbre complet."

      - name: Se supprimer et commiter
        run: |
          # Supprimer un workflow est autorise ; en creer ou en modifier un ne
          # l'est pas — d'ou une livraison qui ne touche aucun autre workflow.
          rm -f .github/workflows/livraison-awy-2-3-0.yml .github/workflows/livraison-awy-2-3-0_2.yml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a commiter : la version 2.3.0 etait deja en place."
          else
            git commit -m "release 2.3.0 : des dates dans l emploi du temps, une annee entiere importable"
            git push
          fi

      - name: Relancer le deploiement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            if gh workflow run deploy.yml --ref master; then
              echo "Deploiement relance."; exit 0
            fi
            echo "Tentative $i echouee, nouvelle tentative dans 10 s..."; sleep 10
          done
          echo "::error::Impossible de relancer deploy.yml. A lancer a la main depuis l'onglet Actions."
          exit 1
