          tar -xzf /tmp/awy/awy15.tar.gz -C .
          git status --porcelain

      - name: Verifier chaque fichier un par un
        run: |
          cat > /tmp/awy/manifest.sha256 <<'FIN_DU_MANIFESTE'
          aecf6e5f7b94a82dab8ed4e6743ae6d017228e205007b1a263b38ab3a0be1d53  src/components/__tests__/BackgroundLocationTokens.test.tsx
          7f67da4a7e630dcd5fce02f2062ee6777077a946c4e9973ff330722353ccf427  src/components/__tests__/ScheduleImport.test.tsx
          668b94ef5438911a1a781f455a465d29426d952e81b96e7ad5a783466fb180f4  src/components/__tests__/ScheduleView.test.tsx
          e6f945716f31cdd457acbf58fa554a0b1470555dd2b30da30a2fb28f900d4592  src/components/schedule/ScheduleImport.tsx
          cb06b7565f2c305a36ca477f341c50106850478630715e048564bc78104b29b7  src/components/schedule/ScheduleView.tsx
          3473aadd90d38bd93bbec8568fcab91ab8e7abb824bef7f4da3959c4b77e74bd  src/components/settings/BackgroundLocationTokens.tsx
          297d4e833d42ba2518974d973466122c1ce7c64142378b371fa14530dc791464  src/components/settings/NotificationsToggle.tsx
          40ffe135d935950eeead4c89d4444096688f4ebaa0742894079999c4af1d72b9  src/lib/__tests__/push.test.ts
          86c6e04884e1bb0d879c6282deed987cb72e10497abf69158033de583afdf31d  src/lib/__tests__/schedule.test.ts
          7d46e19bfb70340129fb1a39eb53f55958d9c0b73bcdaf5751a29956c306def1  src/lib/__tests__/scheduleImportFiles.test.ts
          2cda0e942f408ea363ab228689d198893ab6a7e68769603ce889d07ad46fd585  src/lib/__tests__/scheduleImportParse.test.ts
          9645c5a0b7c350a7515584fce2b7efe9e300968d1e98614015dfdd349733131d  src/lib/push.ts
          8a041871f2c9d64abab3153f22a9652a1be3ec68ad17bdd8b086162f30687a33  src/lib/schedule.ts
          fd0675c0893ae607affa56ccad964e1abe0bd196128c8eec8ef0efb13f8aa92a  src/lib/scheduleImport/index.ts
          731c4900da5ac4fce177d723c23ffecc774b56a50f4152632c68e8904f756d66  src/lib/scheduleImport/parse.ts
          FIN_DU_MANIFESTE
          if ! sha256sum -c /tmp/awy/manifest.sha256; then
            echo "::error::Au moins un fichier ne correspond pas. Rien n'est commite."
            exit 1
          fi
          echo "15/15 fichiers conformes."

      - name: Se supprimer et commiter
        run: |
          rm -f .github/workflows/appliquer-correctifs-awy.yml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a commiter : les correctifs etaient deja en place."
            exit 0
          fi
          git commit -m "fix: 7 defauts navigateur + suppression groupee + content-visibility"
          git push
          echo "Termine. Le deploiement GitHub Pages va repartir tout seul."
