# Awy — application des 15 correctifs en attente
#
# Ce fichier fait tout tout seul :
#   1. il decode l'archive des 15 fichiers (embarquee plus bas, en base64) ;
#   2. il verifie l'empreinte SHA-256 de l'archive PUIS de chaque fichier ecrit ;
#   3. si une seule empreinte ne correspond pas, il s'arrete SANS rien commiter ;
#   4. sinon il commit les 15 fichiers et se supprime lui-meme.
#
# A faire une seule fois : Settings > Actions > General > Workflow permissions
#                          > "Read and write permissions" > Save.
# (On peut remettre "Read repository contents..." juste apres.)

name: Appliquer les 15 correctifs Awy

on:
  push:
    paths:
      - '.github/workflows/appliquer-correctifs-awy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appliquer-correctifs-awy
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

