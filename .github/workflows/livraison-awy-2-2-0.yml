# Awy — livraison 2.2.0, en un seul commit
#
# Pourquoi un seul fichier : livrer un changement fichier par fichier laisse des
# commits intermediaires dont l'arbre ne compile pas, et CI + deploiement passent
# au rouge jusqu'au dernier fichier. C'est ce qui s'est produit le 29 aout. Ici
# les 11 fichiers arrivent ensemble, en une seule fois.
#
# Ce fichier fait tout tout seul :
#   1. il decode les 11 fichiers (embarques plus bas, en base64) ;
#   2. il verifie l'empreinte SHA-256 de l'archive PUIS de chaque fichier ;
#   3. si une seule empreinte ne correspond pas, il s'arrete SANS rien commiter ;
#   4. sinon il commit, relance CI *et* le deploiement, et se supprime lui-meme.
#
# A faire une seule fois : Settings > Actions > General > Workflow permissions
#                          > "Read and write permissions" > Save.
# (On peut remettre "Read repository contents..." juste apres.)

name: Livraison Awy 2.2.0

on:
  push:
    paths:
      - '.github/workflows/livraison-awy-2-2-0.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: livraison-awy
  cancel-in-progress: false

jobs:
  livrer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

