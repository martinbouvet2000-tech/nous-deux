      - name: Verifier l'empreinte de l'archive
        run: |
          attendu="7cfdf3ae82124bb70470e0d7ae5371f0be6c55206a0f0edde89584ea25619a03"
          obtenu="$(sha256sum /tmp/awy/awy.tar.gz | cut -d' ' -f1)"
          echo "attendu : $attendu"
          echo "obtenu  : $obtenu"
          if [ "$attendu" != "$obtenu" ]; then
            echo "::error::Archive abimee pendant le transfert. Rien n'a ete modifie."
            exit 1
          fi

      - name: Extraire les 11 fichiers
        run: |
          tar -xzf /tmp/awy/awy.tar.gz -C .
          git status --porcelain

      - name: Verifier chaque fichier un par un
        run: |
          cat > /tmp/awy/manifest.sha256 <<'FIN_DU_MANIFESTE'
          5a2fafacf91d82044bc318a4b854e2d708d4a5cc2fefa7a4d0c78810b5b69519  .env.example
          0f64d89cacd6b3480b4814bdf8155cf37190d06359fee227e7ad14b06bd34d4b  .github/workflows/ci.yml
          c615c416445d70b8b3346d558e03c2166eddad7c26a5e6a0dc66be0314921d35  CHANGELOG.md
          9b9d6d50b83862e3120615af2641baffbb8fc65959c4b9c5ef6f59c9bee3a728  README.md
          cddde391c91b23b56c6e571af55636fbd16cd9aa499a7d6b1c3d96bd5bdff440  package.json
          451c32ad86aa11b176ba070c53c560475c11f9c90b9dbbe4a2a05f9ec97dfaea  src/lib/__tests__/majAuto.test.ts
          ed9430a16b2a148c3bbf1ff00cedf62f19b448ccba6d7fb57b204b96d9a95fed  src/lib/majAuto.ts
          1c024c63d9107092f3eedb9f43ea26a68f4481cd5e764ce63ba91130115f8720  src/main.tsx
          b1d9bd8ac7c477a9e867e9fcebc6269c5898e426e2e1891e9f2db4b6b3b6514d  src/pages/SettingsPage.tsx
          5f3e284dcb45da6a86e92e594b9076a48d963df1166d71b068caf1f981c45220  src/vite-env.d.ts
          293ca3af0fc0855c9f0777703482c0704d46fdf81102f11c66b2253f5018843f  vite.config.ts
          FIN_DU_MANIFESTE
          if ! sha256sum -c /tmp/awy/manifest.sha256; then
            echo "::error::Au moins un fichier ne correspond pas. Rien n'est commite."
            exit 1
          fi
          echo "11/11 fichiers conformes."

      - name: Installer Node 22
        # Les runners Ubuntu embarquent une version de Node plus ancienne que
        # celle exigee par Vite 8. On fixe la meme version que ci.yml et
        # deploy.yml pour que la verification ci-dessous soit comparable.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Repasser la CI ici avant de commiter
        run: |
          # Le filet le plus important : on ne commit que si l'arbre obtenu
          # passe reellement tout ce que la CI verifie.
          npm ci
          npm run type-check
          npx eslint . --max-warnings 10
          npx vitest run
          npm run build:pages
          echo "CI verte sur l'arbre complet."

      - name: Se supprimer et commiter
        run: |
          rm -f .github/workflows/livraison-awy-2-2-0.yml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a commiter : la version 2.2.0 etait deja en place."
          else
            git commit -m "release 2.2.0 : mise a jour automatique de l app installee + documentation refaite"
            git push
          fi

      - name: Relancer CI et le deploiement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un commit pousse par un workflow ne redeclenche aucun workflow :
          # protection anti-boucle de GitHub. Sans ces deux appels, le depot
          # serait a jour, le site non, et l'onglet Actions resterait muet.
          sleep 10
          for i in 1 2 3 4 5; do
            if gh workflow run deploy.yml --ref master; then
              echo "Deploiement relance."; break
            fi
            echo "Tentative $i echouee, nouvelle tentative dans 10 s..."; sleep 10
            if [ "$i" = "5" ]; then
              echo "::error::Impossible de relancer deploy.yml. A lancer a la main depuis l'onglet Actions."
              exit 1
            fi
          done
          for i in 1 2 3 4 5; do
            if gh workflow run ci.yml --ref master; then
              echo "CI relancee."; break
            fi
            echo "CI pas encore lancable (declencheur manuel tout juste ajoute), nouvelle tentative dans 15 s..."; sleep 15
          done
          echo "Termine. Le site sera a jour dans une minute environ."
