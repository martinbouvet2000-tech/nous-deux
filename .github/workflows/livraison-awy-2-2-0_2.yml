# Awy — livraison 2.2.0, en un seul commit (2e tentative)
#
# La 1re tentative a echoue au push, pour une raison precise et instructive :
# elle modifiait aussi .github/workflows/ci.yml, et GitHub refuse qu'un
# workflow cree ou modifie un autre workflow avec le GITHUB_TOKEN
# (« refusing to allow a GitHub App to create or update workflow »).
# Cette version ne touche plus aucun fichier de workflow — sauf se supprimer
# elle-meme, ce qui est autorise.
#
# Ce fichier fait tout tout seul :
#   1. il decode les 10 fichiers (embarques plus bas, en base64) ;
#   2. il verifie l'empreinte SHA-256 de l'archive PUIS de chaque fichier ;
#   3. il repasse toute la CI sur l'arbre assemble AVANT de commiter ;
#   4. si quoi que ce soit echoue, il s'arrete SANS rien commiter ;
#   5. sinon il commit, relance le deploiement, et se supprime lui-meme.
#
# Les permissions Actions doivent etre sur "Read and write permissions"
# (Settings > Actions > General > Workflow permissions). Elles y sont deja.

name: Livraison Awy 2.2.0

on:
  push:
    paths:
      - '.github/workflows/livraison-awy-2-2-0_2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: livraison-awy
  cancel-in-progress: false

jobs:
  livrer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

