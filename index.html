<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Awy — l'app des couples à distance</title>
    <meta name="description" content="Awy : un espace intime à deux malgré la distance. Vlog, mots doux, humeur du jour, disponibilité, carte, agenda et emploi du temps partagés." />
    <meta name="theme-color" content="#110F0E" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Awy" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Awy" />
    <meta property="og:description" content="Un espace intime à deux, peu importe la distance." />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://hfukmrrinibsdrrevahs.supabase.co" crossorigin />

    <!--
      Coquille de démarrage : peinte à la première image, avant même que le
      JavaScript de l'app soit évalué. React la remplace au premier rendu.
      Elle rend l'ouverture hors ligne identique à l'ouverture en ligne :
      un fond, un en-tête, et un mot si le réseau manque.
    -->
    <style>
      html { background: #110F0E; color-scheme: dark; }
      body { margin: 0; background: #110F0E; color: #F0EAE0; }
      #boot {
        display: flex; flex-direction: column; min-height: 100dvh;
        font-family: 'Instrument Sans Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot .boot-head {
        display: flex; align-items: center; gap: 12px;
        padding: max(1.75rem, env(safe-area-inset-top)) 24px 0;
      }
      #boot .boot-name { font-size: 17px; letter-spacing: -0.01em; color: rgba(240, 234, 224, 0.95); }
      #boot .boot-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px; }
      #boot .boot-cards { width: 100%; max-width: 384px; }
      #boot .boot-card {
        height: 112px; border-radius: 24px; margin-bottom: 12px;
        background: rgba(240, 234, 224, 0.035); animation: bootPulse 2s ease-in-out infinite;
      }
      #boot .boot-card + .boot-card { height: 80px; background: rgba(240, 234, 224, 0.025); }
      #boot .boot-foot { padding-bottom: 40px; text-align: center; font-size: 14px; color: #9B9287; }
      #boot .boot-offline {
        display: none; margin: 0 auto; width: fit-content; max-width: calc(100% - 32px);
        padding: 6px 14px; border-radius: 999px; font-size: 12.5px; line-height: 1.4;
        color: #E8C9A0; background: #1E1B17; box-shadow: inset 0 0 0 1px rgba(212, 165, 116, 0.22);
        position: fixed; inset-inline: 0; top: max(0.5rem, env(safe-area-inset-top));
      }
      html[data-offline='true'] #boot .boot-offline { display: block; }
      html[data-boot-slow='true'] #boot .boot-card { animation: none; }
      @keyframes bootPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-card { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <p class="boot-offline">Hors ligne — les infos peuvent être périmées</p>
        <div class="boot-head">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="rgba(212,165,116,0.7)" aria-hidden="true">
            <path d="M12 21s-7.5-4.9-9.6-9A5.4 5.4 0 0 1 12 6.2 5.4 5.4 0 0 1 21.6 12c-2.1 4.1-9.6 9-9.6 9z" />
          </svg>
          <span class="boot-name">Awy</span>
        </div>
        <div class="boot-body">
          <div class="boot-cards" aria-hidden="true">
            <div class="boot-card"></div>
            <div class="boot-card"></div>
          </div>
        </div>
        <p class="boot-foot" id="boot-status" role="status">Chargement…</p>
      </div>
    </div>
    <noscript>Awy a besoin de JavaScript pour fonctionner.</noscript>
    <script>
      // Réseau absent au chargement : on le dit avant même que React démarre.
      (function () {
        var root = document.documentElement
        var mark = function () { root.dataset.offline = navigator.onLine === false ? 'true' : 'false' }
        mark()
        addEventListener('online', mark)
        addEventListener('offline', mark)
        // Si l'app n'a toujours pas pris la main, on arrête de faire tourner un
        // « Chargement… » dans le vide et on propose de réessayer.
        setTimeout(function () {
          var el = document.getElementById('boot-status')
          if (!el) return
          root.dataset.bootSlow = 'true'
          el.textContent = navigator.onLine === false
            ? "Hors ligne — impossible d'ouvrir Awy pour l'instant. Réessaie une fois le réseau revenu."
            : 'Ça prend plus de temps que prévu… Tu peux réessayer.'
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
