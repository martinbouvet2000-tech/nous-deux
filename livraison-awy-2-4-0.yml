name: livraison 2.4.0

# Awy — livraison auto-appliquante des corrections de l'audit.
#
# POURQUOI CE FICHIER EXISTE. Le dépôt n'est joignable ni en ligne de commande ni
# par le navigateur depuis l'environnement où ces corrections ont été préparées.
# Le seul chemin praticable est celui-ci : déposer un fichier dans
# .github/workflows/ depuis l'interface web de GitHub, et le laisser appliquer le
# reste. Ce fichier transporte donc son propre contenu, en base64.
#
# CE QU'IL FAIT, DANS CET ORDRE.
#   1. vérifie l'empreinte SHA-256 de l'archive, puis celle de CHAQUE fichier ;
#   2. applique les 15 fichiers et les 13 renommages de migrations ;
#   3. rejoue la CI complète sur l'arbre assemblé (types, lint, 430 tests, build) ;
#   4. committe en UNE fois, déclenche le déploiement, puis SE SUPPRIME.
#
# Il ne committe rien tant que les trois premières étapes ne sont pas passées.
#
# LE PIÈGE À CONNAÎTRE. Un commit poussé avec GITHUB_TOKEN ne redéclenche aucun
# autre workflow. C'est pour ça que le déploiement est lancé explicitement à la
# dernière étape, avec plusieurs tentatives.

on:
  push:
    paths:
      - '.github/workflows/livraison-awy-2-4-0.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: livraison-2-4-0
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest

    # La charge utile voyage en variables d'environnement plutôt qu'en documents
    # « ici » : un terminateur de heredoc doit commencer en colonne 1, ce qui
    # casserait le bloc YAML qui le contient.
