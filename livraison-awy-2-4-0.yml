      ARCHIVE_SHA256: eb62525d01273a659c0299691cd655a0dba586c43b3210a0e36b9791010e8027

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Décoder et vérifier l'archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/livraison
          printf '%s' "$CHARGE_B64" | tr -d '[:space:]' | base64 -d > /tmp/livraison/paquet.tgz
          obtenu="$(sha256sum /tmp/livraison/paquet.tgz | cut -d' ' -f1)"
          echo "archive attendue : $ARCHIVE_SHA256"
          echo "archive obtenue  : $obtenu"
          if [ "$ARCHIVE_SHA256" != "$obtenu" ]; then
            echo "::error::L'archive est corrompue. Rien n'a été appliqué."
            exit 1
          fi

      - name: Appliquer les fichiers, et les vérifier un à un
        run: |
          set -euo pipefail
          tar -xzf /tmp/livraison/paquet.tgz -C .
          # Une archive juste ne garantit pas une extraction juste : chaque
          # fichier repasse sur la balance.
          printf '%s' "$EMPREINTES" | sed 's/^ *//' | grep -v '^$' > /tmp/livraison/empreintes.txt
          sha256sum -c - < /tmp/livraison/empreintes.txt
          echo "✓ $(wc -l < /tmp/livraison/empreintes.txt) fichiers vérifiés un à un"

      - name: Renommer les migrations
        run: |
          set -euo pipefail
          printf '%s' "$RENOMMAGES" | sed 's/^ *//' | grep -v '^$' > /tmp/livraison/renommages.txt
          n=0
          while read -r ancien nouveau; do
            if [ ! -f "$ancien" ]; then
              echo "::error::$ancien est introuvable — le dépôt n'est pas dans l'état attendu."
              exit 1
            fi
            git mv "$ancien" "$nouveau"
            n=$((n+1))
          done < /tmp/livraison/renommages.txt
          echo "✓ $n migrations renommées"
          attendu=24
          reel=$(ls supabase/migrations/*.sql | wc -l)
          if [ "$reel" -ne "$attendu" ]; then
            echo "::error::$reel migrations au lieu de $attendu."
            exit 1
          fi
          echo "✓ registre à $reel migrations, comme en base"

      - name: Régénérer le verrou npm
        run: npm install --no-audit --no-fund

      - name: CI complète sur l'arbre assemblé
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run lint
          npm run test
          npm run build
          echo "✓ types, lint, tests et build passent sur l'arbre complet"

      - name: Committer en une fois
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Le workflow se retire lui-même. GITHUB_TOKEN peut supprimer un fichier
          # de workflow ; il ne peut ni en créer ni en modifier un.
          git rm -q -f .github/workflows/livraison-awy-2-4-0.yml
          git add -A
          git commit -m "release 2.4.0 : corrections de l audit (retention 48h, react-router, sauvegarde, registre des migrations)"
          git push origin HEAD:master
          echo "✓ poussé sur master"

      - name: Déclencher le déploiement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Un commit poussé par GITHUB_TOKEN ne redéclenche rien : deploy.yml est
          # lancé explicitement, le temps que la référence soit visible côté API.
          for essai in 1 2 3 4 5; do
            if gh workflow run deploy.yml --ref master; then
              echo "✓ déploiement lancé (tentative $essai)"
              exit 0
            fi
            echo "tentative $essai sans succès, nouvel essai dans 15 s…"
            sleep 15
          done
          echo "::warning::Déploiement non lancé automatiquement — lancer deploy.yml à la main depuis l'onglet Actions."
